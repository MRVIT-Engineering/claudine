name: Website

# Builds the website on pull requests that touch it, and deploys it to Cloudflare on
# pushes to main. Only the deploy step gets the Cloudflare secrets.
on:
  pull_request:
    paths:
      - apps/website/**
      - .github/workflows/website.yml
      - pnpm-lock.yaml
  push:
    branches: [main]
    paths:
      - apps/website/**
      - .github/workflows/website.yml
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a waiting one.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run outside the pnpm workspace with npx, pinned, so its install scripts don't
  # need an allowBuilds entry. See DEPENDENCIES.md.
  WRANGLER: wrangler@4.157.0
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  website:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the website's dependencies
        run: pnpm install --frozen-lockfile --filter @my-editor/website

      - name: Typecheck
        run: pnpm --filter @my-editor/website typecheck

      - name: Build
        run: pnpm --filter @my-editor/website build

      - name: Check the deploy
        working-directory: apps/website
        run: npx --yes "$WRANGLER" deploy --dry-run

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: apps/website
        run: npx --yes "$WRANGLER" deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
