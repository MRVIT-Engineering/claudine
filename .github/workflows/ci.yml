name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://v2.tauri.app/start/prerequisites/
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Run cargo-deny
        run: cargo deny check

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the version matches everywhere
        run: node scripts/check-version.mjs

      - name: Typecheck
        run: |
          pnpm --filter @my-editor/desktop typecheck
          pnpm --filter @my-editor/website typecheck

      - name: Run Biome
        run: pnpm exec biome check .
