[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# LEARN: members opt in with `serde.workspace = true`, like a pnpm catalog entry.
[workspace.dependencies]
cap-std = "3.4.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tauri-build = "2.7.4"

# LEARN: members opt in with `[lints] workspace = true`; lints are not inherited automatically.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
