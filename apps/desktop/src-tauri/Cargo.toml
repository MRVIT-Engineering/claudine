[package]
name = "my-editor-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "my-editor"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
# Never enable tauri's `devtools` feature: it would ship the inspector in release builds.
tauri.workspace = true
tauri-plugin-dialog.workspace = true
my-editor-core.workspace = true
cap-std.workspace = true
serde.workspace = true
serde_json.workspace = true

# LEARN: dependencies under a target table are built only for that platform.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true

[lints]
workspace = true
